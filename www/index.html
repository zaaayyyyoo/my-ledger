<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 确保网页画面直接铺满刘海与底部小白条区域 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Daily Ledger - 智能收支账本</title>
  <style>
    :root {
      --bg: #0b0d14;
      /* 移除昂贵的 backdrop-filter，改用高对比度高性能暗色实色 */
      --card-bg: #151824;
      --card-border: #222738;
      --input-bg: #0e111a;
      --input-border: #262c40;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --control-h: 46px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 解决小白条偏色：html 与 body 统一底色并铺满安全区域 */
    html {
      background-color: var(--bg);
      min-height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      /* 完美沉浸全面屏上下安全区 */
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
      overflow-x: hidden;
      /* 启用移动端硬件加速 */
      transform: translateZ(0);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 顶部仪表盘 */
    .dashboard {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .stats-badge {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      padding: 12px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .val-income { color: var(--success); }
    .val-expense { color: var(--danger); }
    .val-balance { color: var(--text-main); }

    /* 录入面板 */
    .form-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .type-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      height: 44px;
    }

    .type-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .type-btn.active.expense {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .type-btn.active.income {
      background: var(--success-bg);
      color: var(--success);
    }

    .input-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.4fr;
      gap: 10px;
      align-items: center;
    }

    .input-field {
      width: 100%;
      height: var(--control-h);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 0 14px;
      border-radius: 12px;
      font-size: 16px; /* 移动端严禁低于 16px */
      outline: none;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    /* 日期选择器触发条 */
    .custom-datepicker-wrapper {
      position: relative;
      width: 100%;
      height: var(--control-h);
    }

    .datepicker-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 0 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .datepicker-trigger:active {
      border-color: var(--accent);
    }

    .datepicker-trigger svg {
      width: 17px;
      height: 17px;
      color: var(--text-muted);
      margin-left: 6px;
      flex-shrink: 0;
    }

    .btn-submit {
      height: var(--control-h);
      background: var(--accent);
      border: none;
      color: white;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:active {
      opacity: 0.85;
      transform: scale(0.99);
    }

    /* 搜索与筛选工具栏 */
    .filter-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 0 36px 0 38px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
      line-height: 1;
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .custom-range-box {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .custom-range-box.show {
      display: flex;
    }

    .range-date-input {
      flex: 1;
      height: 38px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 0 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      color-scheme: dark;
    }

    /* 记录明细列表 */
    .list-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .count-indicator {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .expense-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .expense-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      padding-right: 12px;
    }

    .item-name {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-all;
    }

    .item-name mark {
      background: rgba(99, 102, 241, 0.35);
      color: #fff;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .item-date {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .item-amount {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .item-amount.income { color: var(--success); }
    .item-amount.expense { color: var(--text-main); }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.3rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      line-height: 1;
    }

    .btn-delete:active {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .empty-state {
      text-align: center;
      padding: 36px 0;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* -------------------------------------------------------------
       解决 Bug 1：重构日历弹窗！绝不模糊、绝对顶层、无死锁
    ------------------------------------------------------------- */
    .calendar-container-modal {
      position: fixed;
      inset: 0;
      z-index: 99999; /* 保证最高层级，不被任何 DOM 遮盖 */
      display: none;
      align-items: flex-end; /* 移动端从底部升起，单手操作最方便 */
      justify-content: center;
    }

    .calendar-container-modal.show {
      display: flex;
    }

    /* 黑色半透明背景点击区域（不加 filter: blur，杜绝性能崩溃与模糊 bug） */
    .calendar-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .calendar-panel {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: #181c2b;
      border-top: 1px solid #2e354d;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100000;
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cal-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .cal-nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-main);
      user-select: none;
    }

    .cal-day:active:not(.empty) {
      background: rgba(255, 255, 255, 0.15);
    }

    .cal-day.empty { cursor: default; }

    .cal-day.today:not(.selected) {
      color: var(--accent);
      font-weight: 700;
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .cal-day.selected {
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .cal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .cal-btn-action {
      background: transparent;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* 桌面 PC 端微调适配 */
    @media (min-width: 641px) {
      .calendar-container-modal {
        align-items: center;
      }
      .calendar-panel {
        border-radius: 20px;
        border: 1px solid #2e354d;
        padding-bottom: 20px;
        animation: popScale 0.15s ease-out;
      }
      @keyframes popScale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
    }

    /* 移动端专属布局 */
    @media (max-width: 640px) {
      .input-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 顶部数据看板 -->
    <header class="dashboard">
      <div class="dashboard-header">
        <h1 class="title">财务概览</h1>
        <span class="stats-badge" id="filterStatusBadge">全部流水</span>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">总收入</div>
          <div class="stat-value val-income" id="totalIncome">¥0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总支出</div>
          <div class="stat-value val-expense" id="totalExpense">¥0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">结余</div>
          <div class="stat-value val-balance" id="netBalance">¥0.00</div>
        </div>
      </div>
    </header>

    <!-- 录入面板 -->
    <form class="form-panel" id="entryForm">
      <div class="type-switcher">
        <button type="button" class="type-btn active expense" id="typeExpenseBtn" onclick="setType('expense')">支出</button>
        <button type="button" class="type-btn income" id="typeIncomeBtn" onclick="setType('income')">收入</button>
      </div>

      <div class="input-grid">
        <input 
          type="text" 
          class="input-field" 
          id="itemInput" 
          placeholder="项目名称（如：午餐、地铁）" 
          required 
          autocomplete="off"
        />
        <input 
          type="number" 
          step="0.01" 
          min="0.01" 
          inputmode="decimal"
          class="input-field" 
          id="amountInput" 
          placeholder="金额 (¥)" 
          required 
        />
        
        <!-- 日期触发条 -->
        <div class="custom-datepicker-wrapper">
          <input type="hidden" id="dateInput" />
          <div class="datepicker-trigger" id="datePickerTrigger">
            <span id="dateDisplayText">选择日期</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">记录此笔支出</button>
    </form>

    <!-- 搜索与筛选工具栏 -->
    <section class="filter-section">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          class="search-input" 
          id="keywordSearchInput" 
          placeholder="搜索项目关键词..." 
          autocomplete="off"
        />
        <button type="button" class="clear-search-btn" id="clearSearchBtn" title="清空">&times;</button>
      </div>

      <div class="filter-controls">
        <button type="button" class="chip-btn active" data-range="all">全部</button>
        <button type="button" class="chip-btn" data-range="today">今天</button>
        <button type="button" class="chip-btn" data-range="week">近7天</button>
        <button type="button" class="chip-btn" data-range="month">本月</button>
        <button type="button" class="chip-btn" data-range="custom">自定义范围</button>
      </div>

      <div class="custom-range-box" id="customRangeBox">
        <input type="date" class="range-date-input" id="startDateInput" />
        <span style="color: var(--text-muted); font-size: 0.8rem">至</span>
        <input type="date" class="range-date-input" id="endDateInput" />
      </div>
    </section>

    <!-- 历史明细流水 -->
    <section class="list-section">
      <div class="section-header">
        <div class="section-title">明细流水</div>
        <div class="count-indicator" id="recordsCountText">共 0 笔</div>
      </div>
      <ul class="expense-list" id="recordList">
        <li class="empty-state">暂无记录，开启你的第一笔收支吧</li>
      </ul>
    </section>
  </div>

  <!-- 重构后的专属模态日历（彻底杜绝模糊死锁） -->
  <div class="calendar-container-modal" id="calendarModal">
    <div class="calendar-backdrop" id="calendarBackdrop"></div>
    <div class="calendar-panel">
      <div class="calendar-header">
        <button type="button" class="cal-nav-btn" id="prevMonthBtn">&lt;</button>
        <div class="cal-title" id="calMonthYearTitle"></div>
        <button type="button" class="cal-nav-btn" id="nextMonthBtn">&gt;</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-days" id="calendarDaysGrid"></div>
      <div class="cal-footer">
        <button type="button" class="cal-btn-action" id="closeCalBtn" style="color: var(--text-muted)">取消</button>
        <button type="button" class="cal-btn-action" id="selectTodayBtn" style="color: var(--accent)">回到今天</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'daily_expenses_records';
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentType = 'expense';

    let searchQuery = '';
    let dateFilterType = 'all';
    let customStartDate = '';
    let customEndDate = '';

    // DOM 引用
    const form = document.getElementById('entryForm');
    const itemInput = document.getElementById('itemInput');
    const amountInput = document.getElementById('amountInput');
    const submitBtn = document.getElementById('submitBtn');
    const recordList = document.getElementById('recordList');
    const totalIncomeDisplay = document.getElementById('totalIncome');
    const totalExpenseDisplay = document.getElementById('totalExpense');
    const netBalanceDisplay = document.getElementById('netBalance');
    const typeExpenseBtn = document.getElementById('typeExpenseBtn');
    const typeIncomeBtn = document.getElementById('typeIncomeBtn');
    const filterStatusBadge = document.getElementById('filterStatusBadge');
    const recordsCountText = document.getElementById('recordsCountText');

    // 搜索筛选 DOM
    const keywordSearchInput = document.getElementById('keywordSearchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const filterChips = document.querySelectorAll('.chip-btn');
    const customRangeBox = document.getElementById('customRangeBox');
    const startDateInput = document.getElementById('startDateInput');
    const endDateInput = document.getElementById('endDateInput');

    // 日历 DOM
    const dateInput = document.getElementById('dateInput');
    const dateDisplayText = document.getElementById('dateDisplayText');
    const datePickerTrigger = document.getElementById('datePickerTrigger');
    const calendarModal = document.getElementById('calendarModal');
    const calendarBackdrop = document.getElementById('calendarBackdrop');
    const closeCalBtn = document.getElementById('closeCalBtn');
    const calMonthYearTitle = document.getElementById('calMonthYearTitle');
    const calendarDaysGrid = document.getElementById('calendarDaysGrid');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const selectTodayBtn = document.getElementById('selectTodayBtn');

    const realToday = new Date();
    const formatYMD = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    let selectedDate = new Date();
    let viewYear = selectedDate.getFullYear();
    let viewMonth = selectedDate.getMonth();

    function updateDateInputUI() {
      const ymd = formatYMD(selectedDate);
      dateInput.value = ymd;
      const isToday = ymd === formatYMD(realToday);
      dateDisplayText.textContent = isToday ? `今天 (${ymd.slice(5)})` : ymd;
    }

    function renderCalendar() {
      calMonthYearTitle.textContent = `${viewYear}年 ${viewMonth + 1}月`;
      calendarDaysGrid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-day empty';
        calendarDaysGrid.appendChild(emptyCell);
      }

      const todayYMD = formatYMD(realToday);
      const selectedYMD = formatYMD(selectedDate);

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = d;

        const thisDateYMD = formatYMD(new Date(viewYear, viewMonth, d));
        if (thisDateYMD === todayYMD) cell.classList.add('today');
        if (thisDateYMD === selectedYMD) cell.classList.add('selected');

        cell.addEventListener('click', () => {
          selectedDate = new Date(viewYear, viewMonth, d);
          updateDateInputUI();
          closeCalendar();
        });

        calendarDaysGrid.appendChild(cell);
      }
    }

    function openCalendar() {
      viewYear = selectedDate.getFullYear();
      viewMonth = selectedDate.getMonth();
      renderCalendar();
      calendarModal.classList.add('show');
    }

    function closeCalendar() {
      calendarModal.classList.remove('show');
    }

    datePickerTrigger.addEventListener('click', openCalendar);
    calendarBackdrop.addEventListener('click', closeCalendar);
    closeCalBtn.addEventListener('click', closeCalendar);

    prevMonthBtn.addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      }
      renderCalendar();
    });

    selectTodayBtn.addEventListener('click', () => {
      selectedDate = new Date();
      updateDateInputUI();
      closeCalendar();
    });

    updateDateInputUI();

    // 模式切换
    window.setType = (type) => {
      currentType = type;
      if (type === 'expense') {
        typeExpenseBtn.className = 'type-btn active expense';
        typeIncomeBtn.className = 'type-btn income';
        itemInput.placeholder = '项目名称（如：午餐、地铁）';
        submitBtn.textContent = '记录此笔支出';
      } else {
        typeExpenseBtn.className = 'type-btn expense';
        typeIncomeBtn.className = 'type-btn active income';
        itemInput.placeholder = '项目名称（如：工资、兼职收入）';
        submitBtn.textContent = '记录此笔收入';
      }
    };

    const formatCurrency = (val) => `¥${val.toFixed(2)}`;
    const saveToLocalStorage = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    };

    // 搜索与筛选
    keywordSearchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
      render();
    });

    clearSearchBtn.addEventListener('click', () => {
      keywordSearchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      render();
    });

    filterChips.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterChips.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        dateFilterType = btn.getAttribute('data-range');

        if (dateFilterType === 'custom') {
          customRangeBox.classList.add('show');
          if (!startDateInput.value) startDateInput.value = formatYMD(realToday);
          if (!endDateInput.value) endDateInput.value = formatYMD(realToday);
          customStartDate = startDateInput.value;
          customEndDate = endDateInput.value;
        } else {
          customRangeBox.classList.remove('show');
        }
        render();
      });
    });

    startDateInput.addEventListener('change', (e) => {
      customStartDate = e.target.value;
      render();
    });

    endDateInput.addEventListener('change', (e) => {
      customEndDate = e.target.value;
      render();
    });

    function highlightMatch(text, query) {
      if (!query) return escapeHTML(text);
      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const reg = new RegExp(`(${safeQuery})`, 'gi');
      return escapeHTML(text).replace(reg, '<mark>$1</mark>');
    }

    const render = () => {
      records.sort((a, b) => new Date(b.date) - new Date(a.date) || b.id - a.id);
      const todayStr = formatYMD(realToday);

      const filteredRecords = records.filter((item) => {
        if (searchQuery && !item.title.toLowerCase().includes(searchQuery)) {
          return false;
        }

        if (dateFilterType === 'today') {
          return item.date === todayStr;
        } else if (dateFilterType === 'week') {
          const itemTime = new Date(item.date).getTime();
          const sevenDaysAgo = new Date(realToday.getTime() - 6 * 24 * 60 * 60 * 1000).setHours(0, 0, 0, 0);
          return itemTime >= sevenDaysAgo;
        } else if (dateFilterType === 'month') {
          return item.date.slice(0, 7) === todayStr.slice(0, 7);
        } else if (dateFilterType === 'custom') {
          if (customStartDate && item.date < customStartDate) return false;
          if (customEndDate && item.date > customEndDate) return false;
          return true;
        }

        return true;
      });

      let filteredIncome = 0;
      let filteredExpense = 0;

      filteredRecords.forEach((item) => {
        const type = item.type || 'expense';
        if (type === 'income') {
          filteredIncome += item.amount;
        } else {
          filteredExpense += item.amount;
        }
      });

      const netBalance = filteredIncome - filteredExpense;
      totalIncomeDisplay.textContent = formatCurrency(filteredIncome);
      totalExpenseDisplay.textContent = formatCurrency(filteredExpense);
      netBalanceDisplay.textContent = formatCurrency(netBalance);
      netBalanceDisplay.style.color = netBalance >= 0 ? 'var(--success)' : 'var(--danger)';

      let statusText = '全部流水';
      if (dateFilterType === 'today') statusText = '今日流水';
      else if (dateFilterType === 'week') statusText = '近7天';
      else if (dateFilterType === 'month') statusText = '本月';
      else if (dateFilterType === 'custom') statusText = '自定义期间';

      if (searchQuery) statusText += ` · "${searchQuery}"`;
      filterStatusBadge.textContent = statusText;
      recordsCountText.textContent = `共 ${filteredRecords.length} 笔`;

      if (filteredRecords.length === 0) {
        recordList.innerHTML = '<li class="empty-state">没有找到收支记录</li>';
        return;
      }

      recordList.innerHTML = filteredRecords
        .map((item) => {
          const type = item.type || 'expense';
          const isIncome = type === 'income';
          const prefix = isIncome ? '+' : '-';
          const amountClass = isIncome ? 'item-amount income' : 'item-amount expense';

          return `
            <li class="expense-item">
              <div class="item-left">
                <div class="item-name">${highlightMatch(item.title, searchQuery)}</div>
                <div class="item-date">${item.date}</div>
              </div>
              <div class="item-right">
                <div class="${amountClass}">${prefix}${formatCurrency(item.amount)}</div>
                <button class="btn-delete" onclick="deleteRecord(${item.id})" title="删除">&times;</button>
              </div>
            </li>
          `;
        })
        .join('');
    };

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const title = itemInput.value.trim();
      const amount = parseFloat(amountInput.value);
      const date = dateInput.value;

      if (!title || isNaN(amount) || amount <= 0 || !date) return;

      const newRecord = {
        id: Date.now(),
        type: currentType,
        title,
        amount,
        date
      };

      records.push(newRecord);
      saveToLocalStorage();
      render();

      itemInput.value = '';
      amountInput.value = '';
      itemInput.blur();
    });

    window.deleteRecord = (id) => {
      records = records.filter((item) => item.id !== id);
      saveToLocalStorage();
      render();
    };

    render();
  </script>
</body>
</html>
