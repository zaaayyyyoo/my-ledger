name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 固定 Ubuntu 24.04，避免 ubuntu-latest 后续迁移到 26.04 带来的构建环境漂移。
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - variant: migration
            app_id: com.wonder.ledger
            app_name: 记账本（旧版数据迁移）
            backup_file: DailyLedger/ledger-backup-legacy.json
          - variant: local
            app_id: com.wonder.ledger.local
            app_name: 记账本（本地）
            backup_file: DailyLedger/ledger-backup-local.json

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          # 这里不能启用 cache: gradle：
          # Android 工程是在后面的“初始化 Android 工程”步骤才生成的，
          # setup-java 此时找不到 gradle-wrapper.properties 就会直接失败。
          # Gradle 自己仍会正常使用 ~/.gradle 缓存机制。

      - name: 安装 Capacitor 依赖
        run: |
          npm install

      - name: 构建 Vue 前端并同步到 www
        env:
          VITE_BACKUP_FILE: ${{ matrix.backup_file }}
        run: npm run build:web

      - name: 注入应用日志功能
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('www/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- DAILY_LEDGER_LOGGER -->'

          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('www/index.html does not contain </body>')
              injection = '  <script src="js/logger.js"></script>\n  ' + marker + '\n'
              path.write_text(text.replace(needle, injection + needle, 1), encoding='utf-8')
              print('Logger injected into build assets')
          else:
              print('Logger already present')
          PY

      - name: 配置当前构建的应用 ID 和名称
        env:
          APP_ID: ${{ matrix.app_id }}
          APP_NAME: ${{ matrix.app_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('capacitor.config.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          config['appId'] = os.environ['APP_ID']
          config['appName'] = os.environ['APP_NAME']
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: 初始化 Android 工程并同步网页
        run: |
          npx cap add android
          npx cap sync android

      - name: 注入跨应用账本迁移接口
        env:
          APP_VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import xml.etree.ElementTree as ET

          candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not candidates:
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.kt'))
          if not candidates:
              raise SystemExit('MainActivity.java/MainActivity.kt not found')
          activity = candidates[0]
          match = re.search(r'^\\s*package\\s+([\\w.]+)', activity.read_text(encoding='utf-8'), re.M)
          if not match:
              raise SystemExit('Cannot detect Android package')
          package_name = match.group(1)
          source_dir = activity.parent
          plugin = """package __PACKAGE__;

          import android.database.Cursor;
          import android.net.Uri;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "LedgerMigrationReader")
          public class LedgerMigrationReaderPlugin extends Plugin {
              @PluginMethod
              public void readLedger(PluginCall call) {
                  JSObject result = new JSObject();
                  Uri uri = Uri.parse("content://com.wonder.ledger.migration/ledger");
                  try (Cursor cursor = getContext().getContentResolver().query(uri, null, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int index = cursor.getColumnIndex("data");
                          if (index >= 0) {
                              result.put("data", cursor.getString(index));
                          }
                      }
                  } catch (Exception ignored) {
                      // No bridge APK installed yet, or its data has not been initialized.
                  }
                  call.resolve(result);
              }
          }
          """
          source_dir.joinpath('LedgerMigrationReaderPlugin.java').write_text(
              plugin.replace('__PACKAGE__', package_name), encoding='utf-8')

          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', android[1:-1])
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          permission_name = 'com.wonder.ledger.permission.READ_LEDGER_MIGRATION'
          if not any(n.get(android + 'name') == permission_name for n in root.findall('uses-permission')):
              root.insert(0, ET.Element('uses-permission', {android + 'name': permission_name}))
          queries = root.find('queries')
          if queries is None:
              queries = ET.Element('queries')
              app = root.find('application')
              root.insert(list(root).index(app), queries)
          if not any(n.get(android + 'authorities') == 'com.wonder.ledger.migration' for n in queries.findall('provider')):
              ET.SubElement(queries, 'provider', {android + 'authorities': 'com.wonder.ledger.migration'})
          if os.environ['APP_VARIANT'] == 'migration':
              if not any(n.get(android + 'name') == permission_name for n in root.findall('permission')):
                  root.insert(list(root).index(root.find('application')), ET.Element('permission', {
                      android + 'name': permission_name,
                      android + 'protectionLevel': 'signature'
                  }))
              provider_code = """package __PACKAGE__;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;

          public class LedgerMigrationProvider extends ContentProvider {
              @Override public boolean onCreate() { return true; }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) {
                  MatrixCursor cursor = new MatrixCursor(new String[] {"data"});
                  if (!"ledger".equals(uri.getLastPathSegment())) return cursor;
                  File file = new File(getContext().getFilesDir(), "ledger-migration.json");
                  if (!file.isFile()) return cursor;
                  try (InputStream input = new FileInputStream(file);
                       ByteArrayOutputStream output = new ByteArrayOutputStream()) {
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count);
                      cursor.addRow(new Object[] {output.toString("UTF-8")});
                  } catch (Exception ignored) {
                      // An absent or incomplete snapshot is reported as no migration data.
                  }
                  return cursor;
              }

              @Override public String getType(Uri uri) { return "vnd.android.cursor.item/vnd.daily-ledger"; }
              @Override public Uri insert(Uri uri, ContentValues values) { return null; }
              @Override public int delete(Uri uri, String selection, String[] selectionArgs) { return 0; }
              @Override public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) { return 0; }
          }
          """
              source_dir.joinpath('LedgerMigrationProvider.java').write_text(
                  provider_code.replace('__PACKAGE__', package_name), encoding='utf-8')
              app = root.find('application')
              if not any(n.get(android + 'authorities') == 'com.wonder.ledger.migration' for n in app.findall('provider')):
                  ET.SubElement(app, 'provider', {
                      android + 'name': '.LedgerMigrationProvider',
                      android + 'authorities': 'com.wonder.ledger.migration',
                      android + 'exported': 'true',
                      android + 'readPermission': permission_name,
                      android + 'grantUriPermissions': 'false'
                  })
          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          print(f'Configured signed app-to-app migration for {os.environ["APP_VARIANT"]}')
          PY

      - name: 配置本地账本备份所需的旧版 Android 存储权限
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('android/app/src/main/AndroidManifest.xml')
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', android[1:-1])
          tree = ET.parse(path)
          root = tree.getroot()
          needed = ('android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE')
          for name in needed:
              if not any(node.get(android + 'name') == name for node in root.findall('uses-permission')):
                  node = ET.Element('uses-permission', {android + 'name': name, android + 'maxSdkVersion': '29'})
                  root.insert(0, node)
          app = root.find('application')
          if app is not None:
              app.set(android + 'requestLegacyExternalStorage', 'true')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: 配置发布签名和版本号
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ledger-release.p12
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 2.2.${{ github.run_number }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text, code_count = re.subn(r'versionCode\s+1\b', f"versionCode {os.environ['APP_VERSION_CODE']}", text, count=1)
          text, name_count = re.subn(r"""versionName\s+['"]1\.0['"]""", f'''versionName "{os.environ['APP_VERSION_NAME']}"''', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName in generated Gradle file')
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
          build_types = text.index('    buildTypes {')
          head, tail = text[:build_types], text[build_types:]
          tail, count = re.subn(r'(        release\s*\{)', r'\1\n            signingConfig signingConfigs.release', tail, count=1)
          if count != 1:
              raise SystemExit('Could not attach release signing config')
          path.write_text(head + tail, encoding='utf-8')
          PY

      - name: 配置 Android 全屏沉浸式系统栏
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Capacitor 每次构建都会重新生成 android/，所以这里直接对生成后的
          # MainActivity 做一次确定性的系统栏配置，避免顶部状态栏和底部手势区
          # 出现独立的灰/黑色背景。
          candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not candidates:
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.kt'))
          if not candidates:
              raise SystemExit('MainActivity.java/MainActivity.kt not found')

          path = candidates[0]
          text = path.read_text(encoding='utf-8')
          m = re.search(r'^\s*package\s+([\w.]+)', text, re.M)
          if not m:
              raise SystemExit(f'Cannot detect MainActivity package in {path}')
          package_name = m.group(1)

          if path.suffix == '.kt':
              code = f'''package {package_name}

          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import androidx.core.view.WindowCompat
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {{
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)

                  val window = window
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {{
                      window.isNavigationBarContrastEnforced = false
                  }}

                  WindowCompat.getInsetsController(window, window.decorView)?.apply {{
                      isAppearanceLightStatusBars = false
                      isAppearanceLightNavigationBars = false
                  }}
              }}
          }}
          '''
          else:
              code = f'''package {package_name};

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {{
                      window.setNavigationBarContrastEnforced(false);
                  }}

                  WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(window, window.getDecorView());
                  if (controller != null) {{
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }}
              }}
          }}
          '''
          if path.suffix == '.java':
              code = code.replace(
                  'super.onCreate(savedInstanceState);',
                  'registerPlugin(LedgerMigrationReaderPlugin.class);\\n        super.onCreate(savedInstanceState);',
                  1
              )
          else:
              code = code.replace(
                  'super.onCreate(savedInstanceState)',
                  'registerPlugin(LedgerMigrationReaderPlugin::class.java)\\n        super.onCreate(savedInstanceState)',
                  1
              )
          path.write_text(code, encoding='utf-8')
          print(f'Configured immersive system bars and ledger migration bridge: {path}')
          PY

      - name: 构建已签名 Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ledger-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传生成的 APK 文件
        uses: actions/upload-artifact@v6
        with:
          name: daily-ledger-${{ matrix.variant }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
