name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: 安装 Capacitor 依赖
        run: |
          npm install

      - name: 注入应用日志功能
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('www/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- DAILY_LEDGER_LOGGER -->'

          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('www/index.html does not contain </body>')
              injection = '  <script src="js/logger.js"></script>\n  ' + marker + '\n'
              path.write_text(text.replace(needle, injection + needle, 1), encoding='utf-8')
              print('Logger injected into build assets')
          else:
              print('Logger already present')
          PY

      - name: 初始化 Android 工程并同步网页
        run: |
          npx cap add android
          npx cap sync android

      - name: 赋予 Gradle 执行权限并构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传生成的 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: daily-ledger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
