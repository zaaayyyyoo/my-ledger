name: Install In-App Logger

on:
  push:
    branches: [main]
    paths:
      - 'www/js/logger.js'
      - '.github/workflows/install-logger.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject logger into app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('www/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- DAILY_LEDGER_LOGGER -->'

          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('www/index.html does not contain </body>')
              injection = '  <script src="js/logger.js"></script>\n  ' + marker + '\n'
              text = text.replace(needle, injection + needle, 1)
              path.write_text(text, encoding='utf-8')
              print('Logger injected into www/index.html')
          else:
              print('Logger already installed')
          PY

      - name: Commit logger integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html www/js/logger.js package.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate in-app diagnostics logger"
          git push
